<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Policy Guard — popup preview</title>
</head>
<body>

<!--
    Renders the real popup against a real extraction, with the WebExtension APIs
    stubbed. The popup markup is fetched from popup/popup.html rather than
    copied, so this harness cannot drift from the real thing.

    Usage: popup-preview.html?fixture=apple-privacy.html&deep=done
      deep = off | idle | running | error | done

    "done" is not faked at the UI layer: two synthetic model findings -- one
    quoting the document, one invented -- are put through the real verify and
    merge pipeline, so the screen shows what those modules actually produce.
-->

<script src="../content/detect.js"></script>
<script src="../content/extract.js"></script>
<script src="../content/content.js"></script>
<script type="module">
    import { compileRules, runRules, summarize } from "../analysis/rules.js";
    import { riskLevelFromFindings } from "../lib/schema.js";
    import { verifyFindings } from "../analysis/verify.js";
    import { mergeFindings } from "../analysis/merge.js";
    import { estimateCost } from "../analysis/llm.js";

    const params = new URLSearchParams(location.search);
    const fixtureFile = params.get("fixture") ?? "apple-privacy.html";
    const deepMode = params.get("deep") ?? "idle";
    const linkedMode = params.get("linked") ?? "none";
    const cachedMode = params.get("cached") === "1";

    const noStore = { cache: "no-store" };

    const cases = await (await fetch("fixtures/index.json", noStore)).json();
    const testCase = cases.find((c) => c.file === fixtureFile) ?? cases[0];

    /* --- run the real content-script pipeline over the fixture ------------ */

    const frame = document.createElement("iframe");

    frame.setAttribute("sandbox", "allow-same-origin");
    frame.style.cssText = "position:absolute;left:-10000px";
    frame.src = "fixtures/" + testCase.file;

    await new Promise((resolve) => {
        frame.addEventListener("load", resolve);
        document.body.append(frame);
    });

    const doc = frame.contentDocument;
    const extraction = PolicyGuard.extract.extractPolicy(doc);

    const detection = PolicyGuard.detect.detectPage(
        doc,
        testCase.url,
        extraction.fullText,
        extraction.wordCount
    );

    const policyLinks = detection.isPolicy
        ? []
        : PolicyGuard.detect.findPolicyLinks(doc, testCase.url);

    const patternData = await (await fetch("../analysis/patterns.json", noStore)).json();
    const { rules } = compileRules(patternData);

    const ruleResult = detection.isPolicy
        ? runRules(extraction.fullText, rules)
        : { findings: [], stats: null };

    /* --- optionally push synthetic model findings through the real gate --- */

    let findings = ruleResult.findings;
    let deepStats = null;
    let riskLevel = riskLevelFromFindings(findings);
    let ranLlm = false;

    if (deepMode === "done" && detection.isPolicy) {
        const realSentence = extraction.fullText
            .split(/\n\n/)
            .map((block) => block.trim())
            .filter((block) => block.length > 160 && block.length < 340)[0] ?? "";

        const synthetic = [
            {
                id: "llm-data_sharing-0-0",
                category: "data_sharing",
                severity: "high",
                title: "Your information reaches other companies",
                description: "This service passes what it knows about you to organisations outside it.",
                quote: realSentence,
                location: null,
                source: "llm",
                confidence: 0.82
            },
            {
                id: "llm-data_selling-0-1",
                category: "data_selling",
                severity: "high",
                title: "Your data is auctioned weekly",
                description: "An invented finding, present to prove the grounding check discards it.",
                quote: "We auction your personal information to the highest bidder every Tuesday.",
                location: null,
                source: "llm",
                confidence: 0.91
            }
        ];

        const verified = verifyFindings(synthetic, extraction.fullText);
        const merged = mergeFindings(ruleResult.findings, verified.findings);

        findings = merged.findings;
        riskLevel = "high";
        ranLlm = true;

        deepStats = {
            ...merged.stats,
            quotesChecked: verified.stats.checked,
            quotesExact: verified.stats.exact,
            quotesFuzzy: verified.stats.fuzzy,
            quotesDropped: verified.stats.dropped,
            dropped: verified.dropped,
            usage: { requests: 1, inputTokens: 14200, outputTokens: 900, cacheReadTokens: 1100 },
            chunks: 1,
            model: "claude-opus-5"
        };
    }

    /* --- optional linked-policy state for the signup-page case ------------ */

    const linked = {};

    if (linkedMode !== "none" && policyLinks.length > 0) {
        const target = policyLinks.find((l) => l.nearAgreement) ?? policyLinks[0];

        if (linkedMode === "running") {
            linked[target.href] = { status: "running", error: null };
        } else if (linkedMode === "error") {
            linked[target.href] = { status: "error", error: "The policy page returned 404." };
        } else {
            // Read a real fixture through the real unrendered path, so this
            // shows what a genuine linked check produces.
            const html = await (await fetch("fixtures/stackoverflow-tos.html", noStore)).text();
            const scanned = PolicyGuard.scanHtml(html, "https://examplr.test/legal/terms-of-service");
            const found = runRules(scanned.fullText, rules).findings;

            linked[target.href] = {
                status: "done",
                isPolicy: true,
                error: null,
                title: scanned.title,
                docType: scanned.detection.docType,
                wordCount: scanned.extraction.wordCount,
                riskLevel: riskLevelFromFindings(found),
                counts: summarize(found),
                findings: found
            };
        }
    }

    const deepStates = {
        off: { status: "idle", available: false, blockedReason: "Deep analysis is switched off in settings." },
        idle: { status: "idle", available: true, blockedReason: null },
        running: { status: "running", available: true, progress: { chunk: 1, chunks: 1 } },
        error: { status: "error", available: true, error: "The API key was rejected. Check it in Policy Guard's settings." },
        done: { status: "done", available: true, stats: deepStats }
    };

    /* --- shape it the way background.js does ------------------------------ */

    const report = {
        supported: true,
        title: doc.title,
        preview: extraction.fullText.slice(0, 400),
        policyLinks,
        linked,
        counts: summarize(findings),
        ruleStats: ruleResult.stats,
        ruleFindings: ruleResult.findings,
        deep: {
            needsPermission: false,
            model: "claude-opus-5",
            estimate: detection.isPolicy ? estimateCost(extraction.fullText, "claude-opus-5") : null,
            progress: null,
            error: null,
            stats: null,
            cached: cachedMode,
            cachedAt: cachedMode ? Date.now() - 86400000 : null,
            ...(deepStates[deepMode] ?? deepStates.idle)
        },
        analysis: {
            url: testCase.url,
            hostname: new URL(testCase.url).hostname,
            analyzedAt: new Date().toISOString(),
            contentHash: null,
            riskLevel,
            summary: "",
            findings,
            tiers: { rules: ruleResult.stats !== null, llm: ranLlm },
            truncated: false,
            detection,
            extraction: {
                method: extraction.method,
                wordCount: extraction.wordCount,
                charCount: extraction.charCount,
                blockCount: extraction.blockCount,
                sectionCount: extraction.sections.length,
                sections: extraction.sections.map((s) => ({
                    heading: s.heading,
                    level: s.level,
                    wordCount: s.wordCount,
                    charStart: s.charStart,
                    charEnd: s.charEnd
                })),
                degraded: extraction.degraded,
                collapsedSections: extraction.collapsedSections,
                unreadableFrames: extraction.unreadableFrames
            }
        }
    };

    globalThis.browser = {
        tabs: {
            query: async () => [{ id: 1, url: testCase.url }]
        },
        permissions: {
            contains: async () => true,
            request: async () => true
        },
        runtime: {
            sendMessage: async (message) => {
                if (message.type === "DEEP_ANALYZE") {
                    console.log("[stub] DEEP_ANALYZE requested");
                    return { started: true };
                }

                return report;
            },
            openOptionsPage: async () => console.log("[stub] openOptionsPage")
        }
    };

    /* --- mount the real popup --------------------------------------------- */

    const markup = await (await fetch("../popup/popup.html", noStore)).text();
    const parsed = new DOMParser().parseFromString(markup, "text/html");

    const styles = document.createElement("link");

    styles.rel = "stylesheet";
    styles.href = "../popup/popup.css";
    document.head.append(styles);

    for (const node of Array.from(parsed.body.children)) {
        if (node.tagName !== "SCRIPT") {
            document.body.append(document.importNode(node, true));
        }
    }

    await import("../popup/popup.js");

    globalThis.__previewReady = true;
</script>

</body>
</html>
